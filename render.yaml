# Two-service setup: Node web service (API) + static site (React frontend).
services:
  # 1) Backend API
  - type: web
    name: hdfc-tracker-api
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI        # set in Render dashboard
        sync: false
      - key: CORS_ORIGIN        # frontend URL, e.g. https://hdfc-tracker.onrender.com
        sync: false

  # 2) Frontend (static)
  - type: web
    name: hdfc-tracker
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL       # backend URL, e.g. https://hdfc-tracker-api.onrender.com
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
