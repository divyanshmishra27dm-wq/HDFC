services:
  # Option 1: Full-stack Web Service (Serves both Express API & React Frontend)
  - type: web
    name: hdfc-career-hub-tracker
    env: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build:frontend
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGODB_URI   # MongoDB Atlas connection string; set in Render dashboard
        sync: false

